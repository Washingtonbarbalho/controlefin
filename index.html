<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Controle de cartões, contas a pagar e contas a receber.">
    <title>FinançasPro</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #334155; min-height: 100dvh; }
        body.modal-active { overflow: hidden !important; }
        button, input, select { -webkit-tap-highlight-color: transparent; }
        .hide { display: none !important; }
        .fade-in { animation: fadeIn .22s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
        .card-surface { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
        .input-modern { width: 100%; border: 1px solid #cbd5e1; border-radius: .75rem; padding: .72rem .85rem; outline: none; background: #fff; font-size: .875rem; transition: border-color .18s, box-shadow .18s; }
        .input-modern:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.11); }
        .input-modern:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }
        .action-icon { width: 2.25rem; height: 2.25rem; border: 1px solid #e2e8f0; background: #fff; border-radius: .65rem; display: inline-flex; align-items: center; justify-content: center; transition: background .18s, transform .18s; }
        .action-icon:hover { background: #f8fafc; transform: translateY(-1px); }
        .status-pill { display: inline-flex; align-items: center; gap: .3rem; padding: .24rem .5rem; border-radius: 999px; font-size: .63rem; line-height: 1; font-weight: 800; text-transform: uppercase; letter-spacing: .025em; }
        .module-tab { display: inline-flex; align-items: center; justify-content: center; padding: .48rem .75rem; border-radius: .65rem; font-size: .78rem; font-weight: 800; color: rgba(255,255,255,.75); transition: background .18s, color .18s; }
        .module-tab:hover, .module-tab.active { color: #fff; background: rgba(255,255,255,.18); }
        .native-picker { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }
        .native-picker::-webkit-calendar-picker-indicator { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .modal-panel { max-height: calc(100dvh - 1rem); overflow-y: auto; overscroll-behavior: contain; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        @media (max-width: 640px) {
            .module-tab span { display: none; }
            .module-tab { width: 2.4rem; padding-left: 0; padding-right: 0; }
        }
    </style>
</head>
<body class="antialiased flex flex-col">
    <div id="global-loader" class="hide fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-[150] flex flex-col items-center justify-center p-6 text-center">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-blue-400 mb-4"></i>
        <p id="global-loader-msg" class="text-white font-extrabold text-lg">Processando...</p>
    </div>

    <nav id="navbar" class="hide sticky top-0 z-50 bg-gradient-to-r from-blue-900 to-blue-600 text-white shadow-lg shrink-0">
        <div class="max-w-6xl mx-auto px-3 sm:px-4 min-h-[60px] flex items-center justify-between gap-2">
            <button type="button" onclick="App.goHome()" class="flex items-center gap-2.5 min-w-0 text-left">
                <span class="w-9 h-9 bg-white/15 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid fa-wallet"></i></span>
                <span class="font-black tracking-tight truncate hidden min-[390px]:inline">FinançasPro</span>
            </button>
            <div id="module-nav" class="hidden items-center gap-1 bg-black/10 rounded-xl p-1"></div>
            <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
                <button id="btn-admin" type="button" onclick="App.navigate('admin')" class="hide w-9 h-9 rounded-xl hover:bg-white/15 flex items-center justify-center" title="Usuários"><i class="fa-solid fa-users-gear"></i></button>
                <button id="btn-install" type="button" onclick="App.installApp()" class="hidden w-9 h-9 rounded-xl bg-amber-400 text-amber-950 hover:bg-amber-300 flex items-center justify-center" title="Instalar"><i class="fa-solid fa-download"></i></button>
                <span id="user-greeting" class="hidden lg:inline text-sm font-semibold max-w-[150px] truncate">Olá!</span>
                <button type="button" onclick="App.logout()" class="w-9 h-9 rounded-xl hover:bg-white/15 flex items-center justify-center" title="Sair"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
            </div>
        </div>
    </nav>

    <main id="app-container" class="flex-1 w-full max-w-6xl mx-auto p-3 sm:p-5 lg:p-7"></main>
    <div id="modals-container"></div>
    <div id="toast-container" class="fixed top-4 right-3 sm:right-5 z-[160] flex flex-col gap-2 max-w-[calc(100vw-1.5rem)]"></div>

    <script type="module" src="./main.js"></script>
</body>
</html>
