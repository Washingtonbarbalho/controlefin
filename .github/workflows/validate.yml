name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate application
        id: validate
        shell: bash
        run: |
          set +e
          status=0
          : > validation.log

          echo "JavaScript syntax" | tee -a validation.log
          for file in *.js; do
            echo "Checking $file" | tee -a validation.log
            node --check "$file" >> validation.log 2>&1
            code=$?
            if [ $code -ne 0 ]; then
              echo "FAILED: $file" | tee -a validation.log
              status=1
            fi
          done

          echo "Required files" | tee -a validation.log
          for file in index.html main.js app-cards.js app-accounts.js app-admin.js firestore.rules; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file" | tee -a validation.log
              status=1
            else
              echo "FOUND: $file" | tee -a validation.log
            fi
          done

          grep -q 'main.js' index.html || { echo 'MISSING REFERENCE: main.js in index.html' | tee -a validation.log; status=1; }
          grep -q 'Contas a Pagar' app-accounts.js || { echo 'MISSING TEXT: Contas a Pagar' | tee -a validation.log; status=1; }
          grep -q 'washington.wn8@gmail.com' firestore.rules || { echo 'MISSING ADMIN EMAIL IN RULES' | tee -a validation.log; status=1; }

          echo "RESULT=$status" | tee -a validation.log
          cat validation.log
          exit $status

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation.log
          retention-days: 1
