name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax - ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - firebase-context.js
          - app-utils.js
          - app-dialogs.js
          - app-modals.js
          - app-forms.js
          - app-navigation.js
          - app-cards.js
          - app-accounts.js
          - app-admin.js
          - app-reports.js
          - app-auth.js
          - main.js
          - sw.js
    steps:
      - name: Clone repository
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$branch" "https://github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Check syntax
        shell: bash
        run: node --check "repo/${{ matrix.file }}"

  required-files:
    name: Required application files
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --depth 1 --branch "$branch" "https://github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Validate structure
        shell: bash
        run: |
          set -e
          cd repo
          test -f index.html
          test -f main.js
          test -f app-cards.js
          test -f app-accounts.js
          test -f app-admin.js
          test -f firestore.rules
          grep -q 'main.js' index.html
          grep -q 'Contas a Pagar' app-accounts.js
          grep -q 'washington.wn8@gmail.com' firestore.rules
