<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Gradiente Azul Moderno para o fundo -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <!-- Sombra suave para o cartão -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.25"/>
        </filter>
    </defs>
    
    <!-- Fundo do Ícone (Arredondado como no iOS) -->
    <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
    
    <g filter="url(#shadow)">
        <!-- Corpo do Cartão de Crédito -->
        <rect x="96" y="160" width="320" height="200" rx="24" fill="#ffffff"/>
        
        <!-- Tarja do Cartão -->
        <rect x="96" y="210" width="320" height="40" fill="#cbd5e1"/>
        
        <!-- Chip de Pagamento -->
        <rect x="136" y="280" width="48" height="32" rx="8" fill="#fbbf24"/>
        
        <!-- Linhas simulando textos/nome -->
        <rect x="200" y="288" width="100" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="200" y="304" width="60" height="8" rx="4" fill="#e2e8f0"/>
        
        <!-- Símbolo de "+" indicando Adicionar/Finanças -->
        <circle cx="360" cy="296" r="24" fill="#3b82f6"/>
        <path d="M348 296 h24 M360 284 v24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
</svg>
